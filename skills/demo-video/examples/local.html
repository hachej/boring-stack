<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Liste de courses</title>
<style>body{font:16px system-ui;margin:0;padding:16px}input,button{font:inherit;padding:10px;border:1px solid #888;border-radius:8px}button{background:#1d4ed8;color:#fff}li{padding:6px 0}</style>
<h1>Liste de courses</h1>
<form id=f><input id=item aria-label="Article" placeholder="Ajouter un article"> <button type=submit>Ajouter</button></form>
<ul id=list></ul><p id=count>0 article</p>
<input type=password id=pw aria-label="Mot de passe" value="invente123">
<script>
const l=document.getElementById('list');
f.addEventListener('submit',e=>{e.preventDefault();if(!item.value)return;const li=document.createElement('li');li.textContent=item.value;l.appendChild(li);item.value='';count.textContent=l.children.length+' article'+(l.children.length>1?'s':'');});
addEventListener('keydown',e=>{if(e.key==='Escape')l.innerHTML='',count.textContent='0 article'});
</script>
